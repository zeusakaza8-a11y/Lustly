<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lustly-only</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    /* En-tête stylisé */
    .site-header {
      text-align: center;
      padding: 20px 0;
      margin-bottom: 25px;
      border-bottom: 2px solid #2a2a2a;
    }

    .site-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
      background: linear-gradient(135deg, #3b82f6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    }

    .search-container input, .admin-panel input, .admin-panel select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      box-sizing: border-box;
    }

    .admin-panel {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid #2a2a2a;
    }

    .btn-submit {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .photo-card {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .photo-card img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
    }

    .video-card {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #2a2a2a;
    }

    .timer-badge {
      background: #3b82f6;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 8px;
      font-weight: bold;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- Titre du site -->
  <header class="site-header">
    <h1 class="site-title">lustly-only</h1>
  </header>

  <!-- Barre de recherche -->
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Rechercher une vidéo ou photo...">
  </div>

  <!-- Formulaire Admin -->
  <div class="admin-panel">
    <h2>Ajouter du contenu</h2>
    
    <label>Type de contenu :</label>
    <select id="contentType">
      <option value="video">Vidéo</option>
      <option value="photo">Photo</option>
    </select>

    <label>Titre :</label>
    <input type="text" id="contentTitle" placeholder="Ex: Mon nouveau vlog">

    <label>Lien de l'image (Cover) :</label>
    <input type="text" id="contentImage" placeholder="https://picsum.photos/800/450">

    <div id="videoUrlGroup">
      <label>Lien de la vidéo (URL MP4) :</label>
      <input type="text" id="contentVideoUrl" placeholder="https://www.w3schools.com/html/mov_bbb.mp4">
    </div>

    <div id="scheduleGroup">
      <label>Heure de publication (ex: 16:00) :</label>
      <input type="time" id="contentTime">
    </div>

    <button id="addBtn" class="btn-submit">Publier sur le site</button>
  </div>

  <!-- Zone Vidéos -->
  <div id="videoContainer"></div>

  <!-- Zone Galerie Photos -->
  <h2 class="section-title">Galerie Photos</h2>
  <div class="photo-grid"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD9lr-s-GjjJJOYwucEdX12RvOi0sMuNHY",
      authDomain: "lustly-80821.firebaseapp.com",
      projectId: "lustly-80821",
      storageBucket: "lustly-80821.firebasestorage.app",
      messagingSenderId: "785746949485",
      appId: "1:785746949485:web:86eed55e00fdbc9a715664"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Recherche
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        const filter = searchInput.value.toLowerCase();
        
        document.querySelectorAll('.video-card').forEach(card => {
          const title = card.querySelector('h3').textContent.toLowerCase();
          card.style.display = title.includes(filter) ? "" : "none";
        });

        document.querySelectorAll('.photo-card').forEach(card => {
          const text = card.querySelector('p').textContent.toLowerCase();
          card.style.display = text.includes(filter) ? "" : "none";
        });
      });
    }

    // Masquer / afficher selon le type
    const contentType = document.getElementById('contentType');
    const scheduleGroup = document.getElementById('scheduleGroup');
    const videoUrlGroup = document.getElementById('videoUrlGroup');

    if (contentType) {
      contentType.addEventListener('change', () => {
        const isPhoto = contentType.value === 'photo';
        if (scheduleGroup) scheduleGroup.style.display = isPhoto ? 'none' : 'block';
        if (videoUrlGroup) videoUrlGroup.style.display = isPhoto ? 'none' : 'block';
      });
    }

    // Ajouter un contenu
    const addBtn = document.getElementById('addBtn');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        const type = contentType.value;
        const title = document.getElementById('contentTitle').value || 'Sans titre';
        const imgUrl = document.getElementById('contentImage').value || 'https://picsum.photos/800/450';
        const videoUrl = document.getElementById('contentVideoUrl').value;
        const time = document.getElementById('contentTime').value;

        db.collection("contents").add({
          type: type,
          title: title,
          imgUrl: imgUrl,
          videoUrl: videoUrl || null,
          time: time || null,
          createdAt: new Date()
        })
        .then(() => {
          alert("Contenu sauvegardé avec succès !");
          document.getElementById('contentTitle').value = '';
          document.getElementById('contentImage').value = '';
          document.getElementById('contentVideoUrl').value = '';
        })
        .catch((error) => {
          alert("Erreur lors de la sauvegarde.");
        });
      });
    }

    // Supprimer un contenu
    function deleteContent(id) {
      if (confirm("Veux-tu vraiment supprimer ce contenu ?")) {
        db.collection("contents").doc(id).delete()
          .then(() => alert("Contenu supprimé !"))
          .catch((err) => alert("Erreur de suppression : " + err));
      }
    }

    // Compte à rebours
    function startCountdowns() {
      document.querySelectorAll('.timer-badge').forEach(timerElement => {
        const targetTimeStr = timerElement.getAttribute('data-time');
        if (!targetTimeStr) return;

        const [targetHours, targetMinutes] = targetTimeStr.split(':').map(Number);
        
        function update() {
          const now = new Date();
          const target = new Date();
          target.setHours(targetHours, targetMinutes, 0, 0);

          if (now > target) {
            target.setDate(target.getDate() + 1);
          }

          const diff = target - now;
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diff / (1000 * 60)) % 60);
          const seconds = Math.floor((diff / 1000) % 60);

          const h = hours < 10 ? "0" + hours : hours;
          const m = minutes < 10 ? "0" + minutes : minutes;
          const s = seconds < 10 ? "0" + seconds : seconds;

          timerElement.textContent = `Disponible dans : ${h}h ${m}m ${s}s`;
        }

        update();
        setInterval(update, 1000);
      });
    }

    // Affichage en direct depuis Firebase
    db.collection("contents").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      const photoGrid = document.querySelector('.photo-grid');
      const videoContainer = document.getElementById('videoContainer');
      
      if (photoGrid) photoGrid.innerHTML = '';
      if (videoContainer) videoContainer.innerHTML = '';

      snapshot.forEach((doc) => {
        const data = doc.data();
        const docId = doc.id;

        if (data.type === 'video' && videoContainer) {
          const videoCard = document.createElement('div');
          videoCard.className = 'video-card';

          const videoElement = data.videoUrl 
            ? `<video controls poster="${data.imgUrl}" style="width:100%; max-height:450px; border-radius:12px;">
                 <source src="${data.videoUrl}" type="video/mp4">
               </video>`
            : `<div class="thumbnail-container">
                 <img src="${data.imgUrl}" alt="${data.title}" style="width:100%; border-radius:12px;">
               </div>`;

          const timerHtml = data.time 
            ? `<div class="timer-badge" data-time="${data.time}">Calcul du compte à rebours...</div>` 
            : '';

          videoCard.innerHTML = `
            ${videoElement}
            <div class="info">
              <h3>${data.title}</h3>
              <p>${data.videoUrl ? 'Prêt à regarder !' : 'Sortie prévue à ' + (data.time || '16h00')}</p>
              ${timerHtml}
              <button class="delete-btn" onclick="deleteContent('${docId}')">Supprimer la vidéo</button>
            </div>
          `;
          videoContainer.appendChild(videoCard);
        }

        if (data.type === 'photo' && photoGrid) {
          const photoCard = document.createElement('div');
          photoCard.className = 'photo-card';
          photoCard.innerHTML = `
            <img src="${data.imgUrl}" alt="${data.title}">
            <p>${data.title}</p>
            <button class="delete-btn" onclick="deleteContent('${docId}')">Supprimer</button>
          `;
          photoGrid.appendChild(photoCard);
        }
      });

      startCountdowns();
    });
  </script>
</body>
</html>
