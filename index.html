<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - lustly-only</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    .admin-panel {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid #2a2a2a;
    }

    .admin-panel input, .admin-panel select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      box-sizing: border-box;
    }

    .btn-submit {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .content-item {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <h1>Espace d'Administration Privé</h1>

  <div class="admin-panel">
    <h2>Ajouter un nouveau contenu</h2>
    
    <label>Type de contenu :</label>
    <select id="contentType">
      <option value="video">Vidéo</option>
      <option value="photo">Photo</option>
    </select>

    <label>Titre :</label>
    <input type="text" id="contentTitle" placeholder="Ex: Mon nouveau contenu">

    <label>Lien de la photo (URL de l'image) :</label>
    <input type="text" id="contentImage" placeholder="Ex: https://i.ibb.co/exemple.jpg">

    <div id="videoUrlGroup">
      <label>Lien de la vidéo (URL MP4) :</label>
      <input type="text" id="contentVideoUrl" placeholder="Ex: https://exemple.com/video.mp4">
    </div>

    <div id="scheduleGroup">
      <label>Heure de publication (ex: 16:00) :</label>
      <input type="time" id="contentTime">
    </div>

    <button id="addBtn" class="btn-submit">Publier sur le site</button>
  </div>

  <h2>Gestion des contenus publiés</h2>
  <div id="adminContentList"></div>

  <script>
    // Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD9lr-s-GjjJJOYwucEdX12RvOi0sMuNHY",
      authDomain: "lustly-80821.firebaseapp.com",
      projectId: "lustly-80821",
      storageBucket: "lustly-80821.firebasestorage.app",
      messagingSenderId: "785746949485",
      appId: "1:785746949485:web:86eed55e00fdbc9a715664"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const contentType = document.getElementById('contentType');
    const scheduleGroup = document.getElementById('scheduleGroup');
    const videoUrlGroup = document.getElementById('videoUrlGroup');

    contentType.addEventListener('change', () => {
      const isPhoto = contentType.value === 'photo';
      scheduleGroup.style.display = isPhoto ? 'none' : 'block';
      videoUrlGroup.style.display = isPhoto ? 'none' : 'block';
    });

    const addBtn = document.getElementById('addBtn');
    addBtn.addEventListener('click', () => {
      const type = contentType.value;
      const title = document.getElementById('contentTitle').value || 'Sans titre';
      const imgUrl = document.getElementById('contentImage').value;
      const videoUrl = document.getElementById('contentVideoUrl').value;
      const time = document.getElementById('contentTime').value;

      if (!imgUrl) {
        alert("Veuillez coller le lien d'une image.");
        return;
      }

      db.collection("contents").add({
        type: type,
        title: title,
        imgUrl: imgUrl,
        videoUrl: videoUrl || null,
        time: time || null,
        createdAt: new Date()
      })
      .then(() => {
        alert("Contenu publié avec succès !");
        document.getElementById('contentTitle').value = '';
        document.getElementById('contentImage').value = '';
        document.getElementById('contentVideoUrl').value = '';
      })
      .catch((error) => {
        alert("Erreur lors de la sauvegarde.");
      });
    });

    function deleteContent(id) {
      if (confirm("Veux-tu vraiment supprimer ce contenu ?")) {
        db.collection("contents").doc(id).delete()
          .then(() => alert("Contenu supprimé !"))
          .catch((err) => alert("Erreur : " + err));
      }
    }

    db.collection("contents").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      const listContainer = document.getElementById('adminContentList');
      listContainer.innerHTML = '';

      snapshot.forEach((doc) => {
        const data = doc.data();
        const docId = doc.id;

        const item = document.createElement('div');
        item.className = 'content-item';
        item.innerHTML = `
          <div>
            <strong>[${data.type.toUpperCase()}]</strong> ${data.title}
          </div>
          <button class="delete-btn" onclick="deleteContent('${docId}')">Supprimer</button>
        `;
        listContainer.appendChild(item);
      });
    });
  </script>
</body>
</html>
