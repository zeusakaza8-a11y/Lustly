<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lustly-only</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    .site-header {
      text-align: center;
      padding: 20px 0;
      margin-bottom: 25px;
      border-bottom: 2px solid #2a2a2a;
    }

    .site-title {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0;
      background: linear-gradient(135deg, #3b82f6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-container input, .admin-panel input, .admin-panel select, .login-panel input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      box-sizing: border-box;
    }

    .admin-panel, .login-panel {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      border: 1px solid #2a2a2a;
    }

    .admin-panel {
      display: none;
    }

    .btn-submit {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }

    .delete-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      display: none;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    .photo-card {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .photo-card img {
      width: 100%;
      height: 180px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #000;
      cursor: pointer;
    }

    .video-card {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #2a2a2a;
    }

    .timer-badge {
      background: #3b82f6;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 8px;
      font-weight: bold;
      font-size: 0.9em;
    }

    .image-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .image-modal img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 10px;
      object-fit: contain;
    }

    .progress-bar {
      width: 100%;
      background-color: #333;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
    }

    .progress-fill {
      width: 0%;
      height: 10px;
      background-color: #3b82f6;
      border-radius: 8px;
      transition: width 0.2s;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">lustly-only</h1>
  </header>

  <div class="login-panel" id="loginPanel">
    <h2>Accès Administrateur</h2>
    <input type="password" id="adminPassword" placeholder="Entrez le mot de passe admin">
    <button class="btn-submit" onclick="checkPassword()">Se connecter</button>
  </div>

  <div class="admin-panel" id="adminPanel">
    <h2>Panneau d'administration</h2>
    
    <label>Type de contenu :</label>
    <select id="contentType">
      <option value="video">Vidéo</option>
      <option value="photo">Photo</option>
    </select>

    <label>Titre :</label>
    <input type="text" id="contentTitle" placeholder="Ex: Mon nouveau vlog">

    <label>Choisir la photo (Cover ou Photo principale) :</label>
    <input type="file" id="contentImageFile" accept="image/*">

    <div id="videoUrlGroup">
      <label>Choisir le fichier vidéo (MP4, MOV...) :</label>
      <input type="file" id="contentVideoFile" accept="video/*">
    </div>

    <div id="scheduleGroup">
      <label>Heure de publication (ex: 16:00) :</label>
      <input type="time" id="contentTime">
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <button id="addBtn" class="btn-submit">Importer et Publier</button>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Rechercher une vidéo ou photo...">
  </div>

  <div id="videoContainer"></div>

  <h2 class="section-title">Galerie Photos</h2>
  <div class="photo-grid"></div>

  <div id="imageModal" class="image-modal" onclick="closeImageModal()">
    <img id="modalImg" src="" alt="Vue agrandie">
  </div>

  <script>
    const SECRET_PASSWORD = "MonMotDePasse123"; 
    let isAdmin = false;

    function checkPassword() {
      const pwd = document.getElementById('adminPassword').value;
      if (pwd === SECRET_PASSWORD) {
        isAdmin = true;
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.querySelectorAll('.delete-btn').forEach(btn => btn.style.display = 'block');
        alert("Connexion réussie !");
      } else {
        alert("Mot de passe incorrect.");
      }
    }

    function openImageModal(url) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = url;
      modal.style.display = 'flex';
    }

    function closeImageModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    const firebaseConfig = {
      apiKey: "AIzaSyD9lr-s-GjjJJOYwucEdX12RvOi0sMuNHY",
      authDomain: "lustly-80821.firebaseapp.com",
      projectId: "lustly-80821",
      storageBucket: "lustly-80821.firebasestorage.app",
      messagingSenderId: "785746949485",
      appId: "1:785746949485:web:86eed55e00fdbc9a715664"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    function filterContent() {
      const filter = document.getElementById('searchInput').value.toLowerCase();
      
      document.querySelectorAll('.video-card').forEach(card => {
        const titleEl = card.querySelector('h3');
        const title = titleEl ? titleEl.textContent.toLowerCase() : '';
        card.style.display = title.includes(filter) ? "" : "none";
      });

      document.querySelectorAll('.photo-card').forEach(card => {
        const textEl = card.querySelector('p');
        const text = textEl ? textEl.textContent.toLowerCase() : '';
        card.style.display = text.includes(filter) ? "" : "none";
      });
    }

    document.getElementById('searchInput').addEventListener('input', filterContent);

    const contentType = document.getElementById('contentType');
    const scheduleGroup = document.getElementById('scheduleGroup');
    const videoUrlGroup = document.getElementById('videoUrlGroup');

    contentType.addEventListener('change', () => {
      const isPhoto = contentType.value === 'photo';
      scheduleGroup.style.display = isPhoto ? 'none' : 'block';
      videoUrlGroup.style.display = isPhoto ? 'none' : 'block';
    });

    // Fonction d'envoi de fichier vers Firebase Storage
    async function uploadFile(file, path) {
      if (!file) return null;
      const storageRef = storage.ref(`${path}/${Date.now()}_${file.name}`);
      const uploadTask = storageRef.put(file);

      return new Promise((resolve, reject) => {
        uploadTask.on('state_changed', 
          (snapshot) => {
            const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            document.getElementById('progressBar').style.display = 'block';
            document.getElementById('progressFill').style.width = progress + '%';
          }, 
          (error) => reject(error), 
          async () => {
            const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
            resolve(downloadURL);
          }
        );
      });
    }

    // Publication du contenu
    const addBtn = document.getElementById('addBtn');
    addBtn.addEventListener('click', async () => {
      const type = contentType.value;
      const title = document.getElementById('contentTitle').value || 'Sans titre';
      const time = document.getElementById('contentTime').value;
      
      const imageFile = document.getElementById('contentImageFile').files[0];
      const videoFile = document.getElementById('contentVideoFile').files[0];

      if (!imageFile && type === 'photo') {
        alert("Veuillez sélectionner une photo depuis votre appareil.");
        return;
      }

      addBtn.disabled = true;
      addBtn.textContent = "Téléversement en cours...";

      try {
        let imgUrl = await uploadFile(imageFile, 'images');
        let videoUrl = null;

        if (type === 'video' && videoFile) {
          videoUrl = await uploadFile(videoFile, 'videos');
        }

        await db.collection("contents").add({
          type: type,
          title: title,
          imgUrl: imgUrl || 'https://picsum.photos/800/450',
          videoUrl: videoUrl || null,
          time: time || null,
          createdAt: new Date()
        });

        alert("Contenu téléversé et publié avec succès !");
        document.getElementById('contentTitle').value = '';
        document.getElementById('contentImageFile').value = '';
        document.getElementById('contentVideoFile').value = '';
        document.getElementById('progressBar').style.display = 'none';
        document.getElementById('progressFill').style.width = '0%';
      } catch (error) {
        console.error(error);
        alert("Erreur lors du téléversement du fichier.");
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = "Importer et Publier";
      }
    });

    function deleteContent(id) {
      if (confirm("Veux-tu vraiment supprimer ce contenu ?")) {
        db.collection("contents").doc(id).delete()
          .then(() => alert("Contenu supprimé !"))
          .catch((err) => alert("Erreur de suppression : " + err));
      }
    }

    function startCountdowns() {
      document.querySelectorAll('.timer-badge').forEach(timerElement => {
        const targetTimeStr = timerElement.getAttribute('data-time');
        if (!targetTimeStr) return;

        const [targetHours, targetMinutes] = targetTimeStr.split(':').map(Number);
        
        function update() {
          const now = new Date();
          const target = new Date();
          target.setHours(targetHours, targetMinutes, 0, 0);

          if (now > target) {
            target.setDate(target.getDate() + 1);
          }

          const diff = target - now;
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diff / (1000 * 60)) % 60);
          const seconds = Math.floor((diff / 1000) % 60);

          const h = hours < 10 ? "0" + hours : hours;
          const m = minutes < 10 ? "0" + minutes : minutes;
          const s = seconds < 10 ? "0" + seconds : seconds;

          timerElement.textContent = `Disponible dans : ${h}h ${m}m ${s}s`;
        }

        update();
        setInterval(update, 1000);
      });
    }

    db.collection("contents").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      const photoGrid = document.querySelector('.photo-grid');
      const videoContainer = document.getElementById('videoContainer');
      
      if (photoGrid) photoGrid.innerHTML = '';
      if (videoContainer) videoContainer.innerHTML = '';

      snapshot.forEach((doc) => {
        const data = doc.data();
        const docId = doc.id;

        if (data.type === 'video' && videoContainer) {
          const videoCard = document.createElement('div');
          videoCard.className = 'video-card';

          const videoElement = data.videoUrl 
            ? `<video controls poster="${data.imgUrl}" style="width:100%; max-height:450px; border-radius:12px; background:#000;">
                 <source src="${data.videoUrl}" type="video/mp4">
               </video>`
            : `<div class="thumbnail-container">
                 <img src="${data.imgUrl}" alt="${data.title}" style="width:100%; border-radius:12px; background:#000;" onclick="openImageModal('${data.imgUrl}')">
               </div>`;

          const timerHtml = data.time 
            ? `<div class="timer-badge" data-time="${data.time}">Calcul du compte à rebours...</div>` 
            : '';

          videoCard.innerHTML = `
            ${videoElement}
            <div class="info">
              <h3>${data.title}</h3>
              <p>${data.videoUrl ? 'Prêt à regarder !' : 'Sortie prévue à ' + (data.time || '16h00')}</p>
              ${timerHtml}
              <button class="delete-btn" style="display: ${isAdmin ? 'block' : 'none'}" onclick="deleteContent('${docId}')">Supprimer la vidéo</button>
            </div>
          `;
          videoContainer.appendChild(videoCard);
        }

        if (data.type === 'photo' && photoGrid) {
          const photoCard = document.createElement('div');
          photoCard.className = 'photo-card';
          photoCard.innerHTML = `
            <img src="${data.imgUrl}" alt="${data.title}" onclick="openImageModal('${data.imgUrl}')">
            <p>${data.title}</p>
            <button class="delete-btn" style="display: ${isAdmin ? 'block' : 'none'}" onclick="deleteContent('${docId}')">Supprimer</button>
          `;
          photoGrid.appendChild(photoCard);
        }
      });

      startCountdowns();
      filterContent();
    });
  </script>
</body>
</html>
